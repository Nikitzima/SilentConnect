name: SilentConnect CI & Security Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Security Scan & Unit Tests (Py 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff cryptography qrcode

      - name: Static analysis for undefined names & syntax errors (Ruff F821/E999)
        run: |
          ruff check --no-cache --select E9,F63,F7,F82 vpn-shop subjson-service scripts tests

      - name: Run Pre-Commit Secret & Quality Gate
        run: |
          python scripts/git_pre_commit.py --full-repo

      - name: Run Strict Security Audit Scanner
        run: |
          python scripts/security_audit_scanner.py --target-dir . --strict

      - name: Run Primary Test Suite (tests/)
        env:
          PYTHONPATH: "vpn-shop:subjson-service:."
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run AWG & Bot Milestone Tests (vpn-shop/)
        env:
          PYTHONPATH: "vpn-shop:subjson-service:."
        run: |
          python -m unittest discover -s vpn-shop -p "test_*.py" -v
